<svg viewBox="0 0 985 480" width="985" xmlns="http://www.w3.org/2000/svg">
  <style>
    text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-muted" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- Title (content center x=492.5) -->
  <text x="492.5" y="32" font-size="16" fill="#1e293b" text-anchor="middle">doc-classifier 原理图（当前实现）</text>

  <!-- ===== Bottom dashed group: planned-but-missing classification logic layer ===== -->
  <rect x="24" y="325" width="937" height="125" rx="10" fill="#f8fafc" stroke="#ec4899" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="34" y="339" font-size="11" fill="#9d174d">方案预想（docs/ 两份文档）：分类逻辑层 —— ✗ 尚未实现</text>

  <rect x="50" y="352" width="200" height="54" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="150" y="374" font-size="11" fill="#64748b" text-anchor="middle">NIST 800-60</text>
  <text x="150" y="392" font-size="11" fill="#64748b" text-anchor="middle">信息类型识别</text>

  <rect x="278" y="352" width="200" height="54" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="378" y="374" font-size="11" fill="#64748b" text-anchor="middle">CIA 三维评估</text>
  <text x="378" y="392" font-size="11" fill="#64748b" text-anchor="middle">C · I · A 分级</text>

  <rect x="506" y="352" width="200" height="54" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="606" y="374" font-size="11" fill="#64748b" text-anchor="middle">FIPS 199</text>
  <text x="606" y="392" font-size="11" fill="#64748b" text-anchor="middle">高水位线映射</text>

  <rect x="734" y="352" width="200" height="54" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="834" y="374" font-size="11" fill="#64748b" text-anchor="middle">confidence · evidence</text>
  <text x="834" y="392" font-size="11" fill="#64748b" text-anchor="middle">置信度与证据输出</text>

  <text x="492.5" y="440" font-size="10" fill="#64748b" text-anchor="middle">同预想未实现的还有：规则引擎兜底 · 双模型交叉验证 · 审计字段（哈希 / 时间戳 / 模型版本 / 原始输出）</text>

  <!-- ===== Row 1: implemented pipeline (y=70, boxes w=165) ===== -->
  <rect x="24" y="70" width="165" height="54" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="106.5" y="92" font-size="12" fill="#1e40af" text-anchor="middle">① 扫描目录</text>
  <text x="106.5" y="110" font-size="11" fill="#1e40af" text-anchor="middle">rglob('*.md')</text>

  <rect x="217" y="70" width="165" height="54" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="299.5" y="92" font-size="12" fill="#b45309" text-anchor="middle">② 文本提取</text>
  <text x="299.5" y="110" font-size="11" fill="#b45309" text-anchor="middle">纯文本 · 截前 5000 字</text>

  <!-- ③ LLM: 4 lines, h=90 -->
  <rect x="410" y="70" width="165" height="90" rx="6" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.5"/>
  <text x="492.5" y="89" font-size="12" fill="#6b21a8" text-anchor="middle">③ LLM 推理</text>
  <text x="492.5" y="106" font-size="11" fill="#6b21a8" text-anchor="middle">Ollama llama3.2:3b</text>
  <text x="492.5" y="123" font-size="11" fill="#6b21a8" text-anchor="middle">temp 0.1 · 重试 ×3</text>
  <text x="492.5" y="140" font-size="11" fill="#6b21a8" text-anchor="middle">&lt;document&gt; 防注入</text>

  <rect x="603" y="70" width="165" height="54" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="685.5" y="92" font-size="12" fill="#b45309" text-anchor="middle">④ JSON 解析</text>
  <text x="685.5" y="110" font-size="11" fill="#b45309" text-anchor="middle">代码块 → 兜底 {...}</text>

  <rect x="796" y="70" width="165" height="54" rx="6" fill="#d1fae5" stroke="#22c55e" stroke-width="1.5"/>
  <text x="878.5" y="92" font-size="12" fill="#166534" text-anchor="middle">⑤ CSV 输出</text>
  <text x="878.5" y="110" font-size="11" fill="#166534" text-anchor="middle">标签 · 解释 · 错误</text>

  <!-- Row 1 connectors -->
  <path d="M194,97 L 206,97" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M387,97 C 387,115 379,115 399,115" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M580,115 C 580,97 572,97 592,97" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M773,97 L 785,97" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ===== config.yaml below ③, feeds up ===== -->
  <rect x="390" y="215" width="205" height="72" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="492.5" y="237" font-size="12" fill="#334155" text-anchor="middle">config.yaml</text>
  <text x="492.5" y="255" font-size="11" fill="#64748b" text-anchor="middle">模型 · 指令 · prompt</text>
  <text x="492.5" y="273" font-size="11" fill="#64748b" text-anchor="middle">四级类别政策文本</text>
  <path d="M492.5,210 L 492.5,171" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="506" y="195" font-size="10" fill="#64748b">加载配置</text>

  <!-- ===== eval benchmark (implemented) ===== -->
  <rect x="700" y="215" width="220" height="72" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="810" y="237" font-size="11" fill="#334155" text-anchor="middle">eval 基准测试 ✓</text>
  <text x="810" y="255" font-size="10" fill="#64748b" text-anchor="middle">混淆矩阵 · 不足 / 过度分类率</text>
  <text x="810" y="273" font-size="10" fill="#64748b" text-anchor="middle">复用 classify_content</text>
</svg>
