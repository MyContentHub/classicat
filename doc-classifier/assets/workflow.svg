<svg viewBox="0 0 800 700" width="800" xmlns="http://www.w3.org/2000/svg">
  <style>
    text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#3b82f6"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#22c55e"/>
    </marker>
    <marker id="arrow-orange" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#f59e0b"/>
    </marker>
    <marker id="arrow-purple" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#a855f7"/>
    </marker>
    <marker id="arrow-pink" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#ec4899"/>
    </marker>
  </defs>

  <text x="400" y="32" font-size="16" fill="#1e293b" text-anchor="middle">doc-classifier 工作流程</text>

  <!-- ===== 配置层 ===== -->
  <!-- config.yaml: x=90 y=60 w=280 h=54, bottom=114 -->
  <rect x="90" y="60" width="280" height="54" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="230" y="83" font-size="12" fill="#b45309" text-anchor="middle">config.yaml（默认配置）</text>
  <text x="230" y="101" font-size="12" fill="#b45309" text-anchor="middle">四级类别 · prompt · 模型名 · 重试参数</text>
  <!-- .env: x=430 y=60 w=280 h=54 -->
  <rect x="430" y="60" width="280" height="54" rx="6" fill="#fce7f3" stroke="#ec4899"/>
  <text x="570" y="83" font-size="12" fill="#9d174d" text-anchor="middle">.env / 系统环境变量（优先级更高）</text>
  <text x="570" y="101" font-size="12" fill="#9d174d" text-anchor="middle">LLM_BASE_URL · API_KEY · MODEL</text>
  <!-- override arrow: .env -> config -->
  <path d="M425,87 L375,87" stroke="#ec4899" marker-end="url(#arrow-pink)"/>
  <text x="400" y="76" font-size="9" fill="#9d174d" text-anchor="middle">覆盖</text>

  <!-- ===== 入口层 ===== -->
  <!-- main.py: x=90 y=170 w=280 h=54, bottom=224 -->
  <rect x="90" y="170" width="280" height="54" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="230" y="193" font-size="12" fill="#1e40af" text-anchor="middle">主流程 main.py</text>
  <text x="230" y="211" font-size="12" fill="#1e40af" text-anchor="middle">--dir &lt;目录&gt; --output result.csv</text>
  <!-- run_eval.py: x=430 y=170 w=280 h=54 -->
  <rect x="430" y="170" width="280" height="54" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="570" y="193" font-size="12" fill="#1e40af" text-anchor="middle">基准测试 run_eval.py</text>
  <text x="570" y="211" font-size="12" fill="#1e40af" text-anchor="middle">--mode levels | pii [--n]</text>

  <!-- ===== 数据层 ===== -->
  <!-- scan: x=90 y=250 w=280 h=54, bottom=304 -->
  <rect x="90" y="250" width="280" height="54" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="230" y="273" font-size="12" fill="#166534" text-anchor="middle">扫描目录下全部 *.md</text>
  <text x="230" y="291" font-size="12" fill="#166534" text-anchor="middle">逐文件读取文本内容</text>
  <!-- benchmark data: x=430 y=250 w=280 h=72, bottom=322 -->
  <rect x="430" y="250" width="280" height="72" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="570" y="268" font-size="12" fill="#166534" text-anchor="middle">levels：自建样本 80 条（中英）</text>
  <text x="570" y="286" font-size="12" fill="#166534" text-anchor="middle">pii：OpenPII 阳性（--n 控制）+ 自建阴性 42 条</text>
  <text x="570" y="304" font-size="10" fill="#166534" text-anchor="middle">样本缓存 pii_cache/sample.json</text>

  <!-- ===== 共享核心组 ===== -->
  <!-- group: x=60 y=360 w=680 h=122, bottom=482 -->
  <rect x="60" y="360" width="680" height="122" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6,4"/>
  <text x="70" y="374" font-size="11" fill="#64748b">共享分类核心（两个入口复用同一管线）</text>
  <!-- prompt box: x=85 y=395 w=190 h=72, bottom=467 -->
  <rect x="85" y="395" width="190" height="72" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="180" y="414" font-size="12" fill="#b45309" text-anchor="middle">组装 Prompt</text>
  <text x="180" y="432" font-size="10" fill="#b45309" text-anchor="middle">system：规则 + 类别定义</text>
  <text x="180" y="450" font-size="10" fill="#b45309" text-anchor="middle">user：prompt + 前 5000 字符</text>
  <!-- llm call box: x=305 y=395 w=190 h=72 -->
  <rect x="305" y="395" width="190" height="72" rx="6" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="400" y="414" font-size="12" fill="#6b21a8" text-anchor="middle">调用 LLM</text>
  <text x="400" y="432" font-size="10" fill="#6b21a8" text-anchor="middle">OpenAI 兼容接口</text>
  <text x="400" y="450" font-size="10" fill="#6b21a8" text-anchor="middle">temperature 0.1</text>
  <!-- json box: x=525 y=395 w=190 h=72 -->
  <rect x="525" y="395" width="190" height="72" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="620" y="414" font-size="12" fill="#b45309" text-anchor="middle">解析结果 extract_json</text>
  <text x="620" y="432" font-size="10" fill="#b45309" text-anchor="middle">```json 代码块正则提取</text>
  <text x="620" y="450" font-size="10" fill="#b45309" text-anchor="middle">category + explanation</text>

  <!-- ===== LLM 后端 ===== -->
  <!-- ollama: x=180 y=505 w=200 h=54 -->
  <rect x="180" y="505" width="200" height="54" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="280" y="528" font-size="12" fill="#166534" text-anchor="middle">本地 Ollama（默认）</text>
  <text x="280" y="546" font-size="10" fill="#166534" text-anchor="middle">qwen2.5:7b · 免费 · 数据不出域</text>
  <!-- cloud: x=420 y=505 w=200 h=54 -->
  <rect x="420" y="505" width="200" height="54" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="520" y="528" font-size="12" fill="#1e40af" text-anchor="middle">云端 API（.env 配置）</text>
  <text x="520" y="546" font-size="10" fill="#1e40af" text-anchor="middle">DeepSeek 等 OpenAI 兼容服务</text>

  <!-- ===== 输出层 ===== -->
  <!-- main output: x=90 y=595 w=280 h=54 -->
  <rect x="90" y="595" width="280" height="54" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="230" y="618" font-size="12" fill="#166534" text-anchor="middle">主流程输出 result.csv</text>
  <text x="230" y="636" font-size="10" fill="#166534" text-anchor="middle">文件名 · 级别 · 解释 · 错误</text>
  <!-- eval output: x=430 y=595 w=280 h=72 -->
  <rect x="430" y="595" width="280" height="72" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="570" y="613" font-size="12" fill="#166534" text-anchor="middle">基准输出 eval_report_levels/pii.csv</text>
  <text x="570" y="631" font-size="10" fill="#166534" text-anchor="middle">混淆矩阵 · 不足/过度分类 · 召回 · 误报</text>
  <text x="570" y="649" font-size="10" fill="#166534" text-anchor="middle">报告打印到终端，明细写入 CSV</text>

  <!-- ===== 普通连接线 ===== -->
  <!-- config / env down into core group -->
  <path d="M88,114 Q 40,140 40,240 L 40,335 Q 40,349 54,349" fill="none" stroke="#f59e0b" marker-end="url(#arrow-orange)"/>
  <path d="M712,114 Q 760,140 760,240 L 760,335 Q 760,349 746,349" fill="none" stroke="#ec4899" marker-end="url(#arrow-pink)"/>
  <!-- entry -> data -->
  <path d="M230,229 L 230,239" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M570,229 L 570,239" stroke="#64748b" marker-end="url(#arrow)"/>
  <!-- data -> core group -->
  <path d="M230,309 L 230,349" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M570,327 L 570,349" stroke="#64748b" marker-end="url(#arrow)"/>
  <!-- in-core: prompt -> llm -> json -->
  <path d="M280,431 L 294,431" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M500,431 L 514,431" stroke="#64748b" marker-end="url(#arrow)"/>
  <!-- llm call -> backends -->
  <path d="M370,472 C 370,490 280,478 280,494" fill="none" stroke="#a855f7" marker-end="url(#arrow-purple)"/>
  <path d="M430,472 C 430,490 520,478 520,494" fill="none" stroke="#a855f7" marker-end="url(#arrow-purple)"/>

  <!-- ===== 跨层回环（结果返回，最上层） ===== -->
  <path d="M58,460 C 40,472 230,560 230,584" fill="none" stroke="#22c55e" stroke-dasharray="6,4" marker-end="url(#arrow-green)"/>
  <path d="M742,460 C 760,472 570,560 570,584" fill="none" stroke="#22c55e" stroke-dasharray="6,4" marker-end="url(#arrow-green)"/>
</svg>
